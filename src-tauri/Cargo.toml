[package]
name = "dashcam-card-scanner"
version = "0.1.8"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "scanner"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
same-file = "1"
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
regex = "1"
sha2 = "0.10"
cap-std = "3"
cap-fs-ext = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

# GTK3/WebKit still require the 0.18 ABI. See vendor/README.md.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }
glib-macros = { path = "vendor/glib-macros-0.18.5" }
gtk3-macros = { path = "vendor/gtk3-macros-0.18.2" }
