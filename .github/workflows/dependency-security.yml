name: Dependency backports and Linux acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-dependencies:
    # Always exercise the GTK graph; macOS-only CI cannot validate these patches.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Native GTK and WebKit dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Install pinned audit tool (live advisory database)
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit real lockfile and disclosed upstream-version projection
        run: python3 scripts/audit-dependencies.py
      - name: Optimized VariantStrIter and real GTK CompositeTemplate expansion
        run: cargo test --locked --release --manifest-path tests/dependency-regressions/Cargo.toml
      - name: Macro diagnostics must fail cleanly, not panic
        run: python3 -m unittest discover -s scripts -p test_dependency_diagnostics.py -v
      - name: Backport enforcement mutation tests
        run: python3 -m unittest discover -s scripts -p test_dependency_backports.py -v
      - name: Full native Linux application checks
        run: |
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
